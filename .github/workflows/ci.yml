# The repo's guardrail: exactly the local checks in CLAUDE.md § Commands, run on every push.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m py_compile skills/*/scripts/*.py hooks/*.py
      - run: 'for f in skills/*/scripts/*.sh; do bash -n "$f"; done'
      - name: ADF round-trip
        run: |
          printf '# sample\n\n- a\n- b\n' > "$RUNNER_TEMP/roundtrip.md"
          python3 skills/ops/scripts/md2adf.py "$RUNNER_TEMP/roundtrip.md" \
            | python3 skills/ops/scripts/adf2md.py -
      # suites exit non-zero on their own; the loop reports and fails the job
      - name: test suites
        run: |
          fail=0
          for t in skills/*/scripts/test_*.py hooks/test_*.py; do
            python3 "$t" || { echo "FAILED: $t"; fail=1; }
          done
          exit $fail
      - name: coverage gate (100% on the spec engine and its generator)
        run: |
          pip install coverage
          cd skills/ops/scripts
          for t in test_rest_ops_spec.py test_gen_spec_index.py test_acli_rest_write.py test_acli_rest_get.py; do
            coverage run --branch --data-file=/tmp/ak.cov --append "$t" > /dev/null
          done
          coverage report --data-file=/tmp/ak.cov --include='*/rest_ops_spec.py,*/gen_spec_index.py' --fail-under=100 --show-missing
      - name: version bump
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          .github/check-version-bump.sh "$base"
